name: SEO Check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 干净安装（按锁文件），失败即阻断，不用临时 npm install 补包
      - name: Install dependencies (lockfile)
        run: npm ci

      # 单元测试（rehype 标题转换）+ 反例测试（本地 mock，无需公网）
      - name: Unit & negative tests
        run: npm test

      # 构建 + 真实产物 SEO 校验（失败阻断 CI）
      - name: Build & SEO check (artifacts)
        run: npm run seo:check

      # 隔离发布夹具：新增 Markdown 无需手改 _redirects / 生图，构建+校验通过，并自清理
      - name: Publish fixture test
        run: npm run test:fixture

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # 部署后验证不在这里跑（需确认线上已部署对应提交），见 seo-deploy-verify.yml。
